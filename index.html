<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Restore path encoded by 404.html redirect (GitHub Pages SPA routing).
      (function () {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        if (p) {
          var h = params.get('h') || '';
          params.delete('p');
          params.delete('h');
          var qs = params.toString();
          window.history.replaceState(
            null, null,
            p + (qs ? '?' + qs : '') + h
          );
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/brand2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luméra Fine Pearls</title>
    <meta name="description" content="Fine pearl jewelry handcrafted in Seattle." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&family=Noto+Serif+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!--
      Organization + WebSite structured data. Static (not injected by JS) so
      non-rendering crawlers — Bing, GPTBot, PerplexityBot, ClaudeBot, and
      whatever backs Google's AI Overview — can see it without executing
      React. This is the entity-identity signal tying this exact domain to
      our real social accounts, so brand-name lookups for "Lumera"/"Luméra
      Fine Pearls" resolve to us instead of an unrelated account that
      happens to share the name.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Luméra Fine Pearls",
        "alternateName": "Lumera Fine Pearls",
        "url": "https://lumerafinepearls.com",
        "logo": "https://lumerafinepearls.com/gallery/logo.webp",
        "description": "Fine pearl jewelry handcrafted in Seattle.",
        "sameAs": [
          "https://instagram.com/lumera_pearls",
          "https://www.xiaohongshu.com/user/profile/65720f9b000000001902f3f6"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Luméra Fine Pearls",
        "url": "https://lumerafinepearls.com"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
