<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Restore path encoded by 404.html redirect (GitHub Pages SPA routing).
      (function () {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        if (p) {
          var h = params.get('h') || '';
          params.delete('p');
          params.delete('h');
          var qs = params.toString();
          window.history.replaceState(
            null, null,
            p + (qs ? '?' + qs : '') + h
          );
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/brand2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luméra Fine Pearls</title>
    <meta name="description" content="Fine pearl jewelry handcrafted in Seattle." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&family=Noto+Serif+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
